<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>꿈방 목록 — 오늘 보낸 인원수별 미리보기</title>
    <style>
      :root {
        --bg: #fbfaf4;
        --card-paper: #fffdf7;
        --lav-mist: #f1eaf6;
        --lav-tint: #e9e4fb;
        --lav-primary: #8b7bc8;
        --lav-primary-light: #a99cf2;
        --ink: #1f1e1b;
        --ink-muted: #5f5a52;
        --ink-soft: #8b7f6f;
        --divider: #d8cdbb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px 24px 96px;
        background: var(--bg);
        color: var(--ink);
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "Apple SD Gothic Neo",
          "Noto Sans KR",
          sans-serif;
      }
      header {
        max-width: 540px;
        margin: 0 auto 28px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 22px;
        font-weight: 800;
      }
      .subtitle {
        margin: 0;
        color: var(--ink-muted);
        font-size: 14px;
        line-height: 1.5;
      }
      .scenarios {
        max-width: 540px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .scenario-label {
        margin: 0 0 6px;
        padding-left: 6px;
        color: var(--ink-muted);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .room-item {
        min-height: 96px;
        padding: 18px 22px;
        border-radius: 28px;
        background: var(--lav-mist);
        border: 1px solid var(--divider);
        display: flex;
        align-items: center;
        box-shadow:
          2px 4px 7px rgba(31, 30, 27, 0.1),
          4px 12px 22px rgba(31, 30, 27, 0.13);
      }
      .room-text {
        flex: 1;
        padding-right: 12px;
      }
      .room-name {
        font-size: 22px;
        font-weight: 800;
      }
      .room-meta {
        margin-top: 6px;
        color: var(--ink-soft);
        font-size: 14px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .room-side {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .member-stack {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }
      .member-row {
        display: flex;
        align-items: center;
      }
      .member-dot {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--card-paper);
        border: 2px solid var(--lav-tint);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .member-dot:not(:first-child) {
        margin-left: -10px;
      }
      .member-dot svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .room-divider {
        width: 1px;
        height: 30px;
        background: var(--lav-tint);
      }
      .latest-badge {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        overflow: hidden;
      }
      .latest-badge svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      footer {
        max-width: 540px;
        margin: 36px auto 0;
        padding: 16px 20px;
        border-radius: 18px;
        background: var(--card-paper);
        border: 1px solid var(--divider);
        font-size: 13px;
        color: var(--ink-muted);
        line-height: 1.6;
      }
      footer strong {
        color: var(--ink);
      }
      footer ul {
        margin: 8px 0 0;
        padding-left: 18px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>꿈방 목록 — 인원수별 미리보기</h1>
      <p class="subtitle">
        오늘 꿈카드를 보낸 사람들은 왼쪽 작은 스택으로, 가장 최근에 보낸 사람은
        오른쪽 큰 배지로 표시됩니다.
      </p>
    </header>

    <div class="scenarios" id="scenarios"></div>

    <footer>
      <strong>레이아웃 규칙</strong>
      <ul>
        <li>1 ~ 5명: 한 줄에 stack</li>
        <li>6 ~ 10명: 위·아래 두 줄로 stack (위 5 + 아래 나머지)</li>
        <li>11명 이상: 좌측 스택은 숨기고 최신 배지만 표시</li>
        <li>0명: 좌측 스택 없음, 오른쪽은 잠자는 달(Zz) 아이콘</li>
      </ul>
    </footer>

    <script>
      const COLORS = [
        "#FFD6E8",
        "#8DD6D1",
        "#FFD66B",
        "#A99CF2",
        "#FFB97E",
        "#76CDBA",
        "#9BDDEB",
        "#E1BEE7",
        "#FF9AA2",
        "#FFCF7F",
      ];

      function avatarSvg(color) {
        return `
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="32" r="30" fill="${color}"/>
            <circle cx="25" cy="26" r="21" fill="#FFFDF7" opacity="0.14"/>
            <path d="M41 12c-7.7 3.1-12.5 10-12.5 18.1 0 9.7 7.3 17.7 16.7 19-3.5 2.7-7.9 4.2-12.6 4.2-11.6 0-21-9.4-21-21 0-10.8 8.2-19.8 18.7-20.9 3.7-.4 7.4.2 10.7 1.6z" fill="#FFD66B"/>
            <path d="M15.5 45.5c0-4.6 3.7-8.3 8.3-8.3.8-5.8 5.8-10.3 11.8-10.3 5.7 0 10.5 4 11.7 9.4h.7c4.6 0 8.3 3.7 8.3 8.3 0 4.5-3.7 8.2-8.3 8.2H23.8c-4.6 0-8.3-3.3-8.3-7.3z" fill="#F1FAF6"/>
            <path d="M23.8 37.2c.8-5.8 5.8-10.3 11.8-10.3 2.6 0 5 .8 7 2.2-4.9.8-8.8 4.5-9.8 9.3-4.2.4-7.4 3.9-7.4 8.2 0 2.6 1.2 4.9 3 6.4h-4.6c-4.6 0-8.3-3.3-8.3-7.3 0-4.7 3.7-8.5 8.3-8.5z" fill="#E9E4FB"/>
            <polygon points="47,13 50,19 56,20 51.6,24.4 52.7,30.5 47,27.6 41.3,30.5 42.4,24.4 38,20 44,19" fill="#FFE891"/>
            <polygon points="52,33 54,36.8 58.2,37.4 55.1,40.4 55.8,44.6 52,42.6 48.2,44.6 48.9,40.4 45.8,37.4 50,36.8" fill="#FFE891"/>
          </svg>
        `;
      }

      function sleepingMoonSvg() {
        return `
          <svg viewBox="0 -6 64 70" xmlns="http://www.w3.org/2000/svg">
            <g transform="rotate(-24 45 48)">
              <path d="M36.4 40.1c.1-1 .9-1.6 1.9-1.5l13.5 1.7c1.1.1 1.7.9 1.5 2l-.6 3.1c-.1.7-.5 1.2-1.1 1.6l-8.2 5.5 10.1 1.4c1 .1 1.5.9 1.3 1.9l-.8 3.4c-.2.9-.9 1.4-1.9 1.2l-14.4-2.5c-1.1-.2-1.6-1-1.4-2.1l.8-3.5c.1-.6.5-1.2 1.1-1.6l8.6-5.5-9.3-1.2c-1.1-.1-1.6-.9-1.4-2z"
                fill="#FFFDF7" stroke="#1F1E1B" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/>
            </g>
            <g transform="rotate(15 34 34)">
              <path d="M24.2 24.7c.2-1.1 1-1.7 2.1-1.5l16.2 2.7c1.3.2 1.9 1.2 1.5 2.5l-1.2 4.1c-.2.8-.8 1.4-1.5 1.8l-10.1 6.4 13.1 2.3c1.1.2 1.7 1 1.5 2.1l-.8 4.1c-.2 1.2-1.1 1.8-2.3 1.5l-18.3-3.6c-1.2-.2-1.8-1.1-1.5-2.3l.9-4.6c.2-.8.7-1.5 1.4-2l10.7-6.6-10.5-1.8c-1.2-.2-1.8-1.1-1.5-2.3z"
                fill="#FFFDF7" stroke="#1F1E1B" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
            </g>
            <g transform="translate(0 -2) rotate(2 20 18)">
              <path d="M7.8 4.6c-.1-1.4.9-2.3 2.3-2.2l21.1 1c1.5.1 2.5 1 2.5 2.5l-.1 4.6c0 1-.4 1.9-1.2 2.7L17.9 26l14-.6c1.7-.1 2.7.9 2.7 2.5l.1 4.8c.1 1.5-.9 2.4-2.4 2.5l-22.6.8C8 36.1 7 35.1 6.9 33.5l-.3-6.3c-.1-1 .2-1.9 1-2.7l14.3-12.6-11.4.1c-1.5 0-2.4-.9-2.5-2.3z"
                fill="#FFFDF7" stroke="#1F1E1B" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
            </g>
          </svg>
        `;
      }

      const PER_ROW = 5;
      const MAX_STACK = 10;

      function buildRoomSide(count) {
        const showStack = count > 0 && count <= MAX_STACK;
        const showLatest = count > 0;

        let html = '<div class="room-side">';

        if (showStack) {
          const topCount = Math.min(count, PER_ROW);
          const bottomCount = Math.max(0, count - PER_ROW);
          html += '<div class="member-stack">';
          html += '<div class="member-row">';
          for (let i = 0; i < topCount; i++) {
            html += `<div class="member-dot">${avatarSvg(COLORS[i % COLORS.length])}</div>`;
          }
          html += "</div>";
          if (bottomCount > 0) {
            html += '<div class="member-row">';
            for (let i = 0; i < bottomCount; i++) {
              const colorIdx = (i + PER_ROW) % COLORS.length;
              html += `<div class="member-dot">${avatarSvg(COLORS[colorIdx])}</div>`;
            }
            html += "</div>";
          }
          html += "</div>";
          html += '<div class="room-divider"></div>';
        }

        if (showLatest) {
          html += `<div class="latest-badge">${avatarSvg(COLORS[0])}</div>`;
        } else {
          html += `<div class="latest-badge">${sleepingMoonSvg()}</div>`;
        }

        html += "</div>";
        return html;
      }

      const SCENARIOS = [
        { count: 0, label: "0명 — 오늘 활동 없음 (잠자는 달)" },
        { count: 1, label: "1명" },
        { count: 2, label: "2명" },
        { count: 3, label: "3명" },
        { count: 4, label: "4명" },
        { count: 5, label: "5명 — 한 줄 최대" },
        { count: 6, label: "6명 — 두 줄 시작" },
        { count: 7, label: "7명" },
        { count: 8, label: "8명" },
        { count: 9, label: "9명" },
        { count: 10, label: "10명 — 두 줄 최대" },
        { count: 11, label: "11명 — 스택 숨김, 최신만 표시" },
        { count: 25, label: "25명 — 스택 숨김 (대규모 그룹)" },
      ];

      const container = document.getElementById("scenarios");
      container.innerHTML = SCENARIOS.map((s) => {
        const meta = `방금 · 오늘 꿈카드 ${s.count}개`;
        return `
          <div>
            <div class="scenario-label">${s.label}</div>
            <div class="room-item">
              <div class="room-text">
                <div class="room-name">테스트</div>
                <div class="room-meta">${meta}</div>
              </div>
              ${buildRoomSide(s.count)}
            </div>
          </div>
        `;
      }).join("");
    </script>
  </body>
</html>
