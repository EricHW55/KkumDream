# fly.toml app configuration file generated for kkumdream-backend on 2026-05-13T01:39:16Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kkumdream-backend'
primary_region = 'nrt'

[build]

[env]
  AI_MOCK_MODE = 'true'
  API_V1_PREFIX = '/api/v1'
  ENVIRONMENT = 'production'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
